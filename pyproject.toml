[project]
name = "testing"
version = "0.1.0"
description = "Testing section"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.143.0",
    "greenlet>=3.5.6",
    "pydantic>=2.14.0",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["."]